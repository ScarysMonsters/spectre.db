[package]
name = "spectre-db-napi"
version = "2.1.2"
edition = "2021"
license = "CUSTOM"
description = "Node.js / Bun native bindings (napi-rs v3) for spectre.db v2"

[lib]
crate-type = ["cdylib"]

[dependencies]
spectre-db-core = { path = "../core" }
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
serde_json = { version = "1", features = ["raw_value"] }

[build-dependencies]
napi-build = "2"
