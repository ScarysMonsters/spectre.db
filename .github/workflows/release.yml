name: Release (prebuilds + npm publish)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Rust unit tests
        run: cargo test -p spectre-db-core
      - name: Build native module
        run: npm run build
      - name: JS integration tests (native engine)
        run: npx jest --runInBand
      - name: JS integration tests (fallback engine)
        run: npm run test:fallback
      - name: Fault injection
        run: npm run test:fault

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg: spectre-db-linux-x64-gnu
            artifact: libspectre_db_napi.so
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            pkg: spectre-db-linux-x64-musl
            artifact: libspectre_db_napi.so
            apt: musl-tools
          - os: macos-latest
            target: x86_64-apple-darwin
            pkg: spectre-db-darwin-x64
            artifact: libspectre_db_napi.dylib
          - os: macos-14
            target: aarch64-apple-darwin
            pkg: spectre-db-darwin-arm64
            artifact: libspectre_db_napi.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: spectre-db-win32-x64-msvc
            artifact: spectre_db_napi.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install system packages
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - name: Build
        run: cargo build --release -p spectre-db-napi --target ${{ matrix.target }}
      - name: Package platform binary
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "npm/${{ matrix.pkg }}/spectre.db-rs.node"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: npm/${{ matrix.pkg }}/

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: npm-artifacts
      - name: Place prebuilds
        run: |
          find npm-artifacts -name '*.node' | while read -r f; do
            pkg=$(basename "$(dirname "$f")")
            cp "$f" "npm/$pkg/"
          done
          ls npm/*/
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      - name: Check versions
        run: node scripts/check-versions.js
      - name: Publish platform packages
        run: |
          for d in npm/*/; do
            npm publish "$d" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish root package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
